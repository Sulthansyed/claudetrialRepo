<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -700 520 720" width="520" height="720"><defs>
<filter id="pp-tex" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="s"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="3" seed="3" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.55 0 0 0 0.225  0.55 0 0 0 0.225  0.55 0 0 0 0.225  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="s" mode="soft-light" result="b"/>
  <feComposite in="b" in2="s" operator="in"/>
</filter>
<filter id="pp-tex-s" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="5" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="s"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.4 0 0 0 0.3  0.4 0 0 0 0.3  0.4 0 0 0 0.3  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="s" mode="soft-light" result="b"/>
  <feComposite in="b" in2="s" operator="in"/>
</filter>
<filter id="pp-lift" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
  <feComposite in="SourceGraphic" in2="o1" operator="out" result="e1"/>
  <feFlood flood-color="#FFFFFF" flood-opacity="0.55"/>
  <feComposite in2="e1" operator="in" result="hi"/>
  <feOffset in="SourceAlpha" dx="-1.5" dy="-1.5" result="o2"/>
  <feComposite in="SourceGraphic" in2="o2" operator="out" result="e2"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.35"/>
  <feComposite in2="e2" operator="in" result="lo"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.6"/>
  <feOffset dx="2.2" dy="3.6" result="sb"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.30"/>
  <feComposite in2="sb" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
</filter>
<filter id="pp-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
  <feOffset dx="8" dy="13" result="sb"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.20"/>
  <feComposite in2="sb" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="pp-card" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.8 0.5" numOctaves="3" seed="21" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.45 0 0 0 0.275  0.45 0 0 0 0.275  0.45 0 0 0 0.275  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/>
  <feComposite in="b" in2="SourceGraphic" operator="in"/>
</filter>
</defs><g filter="url(#pp-drop)"><g class="rig rig-klik"><g data-part="shadow"><g transform="matrix(1 0 0 1 0 0)"><ellipse cx="0" cy="-8" rx="92" ry="12" fill="#0D2047" opacity="0.13"/></g></g>
<g data-part="antenna" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><path d="M0,-436 C0,-466 8,-484 26,-497" fill="none" stroke="#293B69" stroke-width="12" stroke-linecap="round"/><ellipse cx="0" cy="-432" rx="27" ry="15" fill="#293B69"/></g></g></g>
<g data-part="cursor" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><path d="M0,0 L0,46 L11.5,35 L19.5,52.5 L28,48.5 L20,31.5 L35,31.5 Z" transform="translate(20 -545) rotate(-10)" fill="#FFFFFF" stroke="#0D2047" stroke-width="3.6" stroke-linejoin="round"/></g></g></g>
<g data-part="bodyBack" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><rect x="-112" y="-424" width="224" height="200" rx="50" fill="#23949C"/></g></g></g>
<g data-part="body" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><rect x="-112" y="-432" width="224" height="196" rx="50" fill="#2EA9B0"/><path d="M-70,-424 L70,-424" fill="none" stroke="#41B8BC" stroke-width="5" stroke-linecap="round"/></g></g></g>
<g data-part="bezel" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><rect x="-89" y="-410" width="178" height="154" rx="31" fill="#293B69"/></g></g></g>
<g data-part="screen" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex)"><rect x="-79" y="-401" width="158" height="136" rx="24" fill="#17254A"/></g></g></g>
<g data-part="face" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 34.808 -23.8242)"><g filter="url(#pp-tex-s)"><path d="M-64,-335 Q-44,-363 -24,-335" fill="none" stroke="#2C6A8E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M-64,-335 Q-44,-363 -24,-335" fill="none" stroke="#D8F7F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M24,-335 Q44,-363 64,-335" fill="none" stroke="#2C6A8E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M24,-335 Q44,-363 64,-335" fill="none" stroke="#D8F7F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17,-313 L17,-313 Q17,-291 0,-291 Q-17,-291 -17,-313 Z" fill="#2C6A8E" stroke="#2C6A8E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17,-313 L17,-313 Q17,-291 0,-291 Q-17,-291 -17,-313 Z" fill="#D8F7F9" stroke="#D8F7F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g></g></svg>