<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -600 280 290" width="280" height="290"><defs>
<filter id="pp-tex" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="s"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="3" seed="3" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.55 0 0 0 0.225  0.55 0 0 0 0.225  0.55 0 0 0 0.225  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="s" mode="soft-light" result="b"/>
  <feComposite in="b" in2="s" operator="in"/>
</filter>
<filter id="pp-tex-s" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="5" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="s"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.4 0 0 0 0.3  0.4 0 0 0 0.3  0.4 0 0 0 0.3  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="s" mode="soft-light" result="b"/>
  <feComposite in="b" in2="s" operator="in"/>
</filter>
<filter id="pp-lift" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
  <feComposite in="SourceGraphic" in2="o1" operator="out" result="e1"/>
  <feFlood flood-color="#FFFFFF" flood-opacity="0.55"/>
  <feComposite in2="e1" operator="in" result="hi"/>
  <feOffset in="SourceAlpha" dx="-1.5" dy="-1.5" result="o2"/>
  <feComposite in="SourceGraphic" in2="o2" operator="out" result="e2"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.35"/>
  <feComposite in2="e2" operator="in" result="lo"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.6"/>
  <feOffset dx="2.2" dy="3.6" result="sb"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.30"/>
  <feComposite in2="sb" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
</filter>
<filter id="pp-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
  <feOffset dx="8" dy="13" result="sb"/>
  <feFlood flood-color="#0D2047" flood-opacity="0.20"/>
  <feComposite in2="sb" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="pp-card" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.8 0.5" numOctaves="3" seed="21" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0.45 0 0 0 0.275  0.45 0 0 0 0.275  0.45 0 0 0 0.275  0 0 0 0 1" result="g"/>
  <feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/>
  <feComposite in="b" in2="SourceGraphic" operator="in"/>
</filter>
</defs><g filter="url(#pp-drop)"><g class="rig rig-girl"><g data-part="head" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex)"><ellipse cx="0" cy="-424" rx="77" ry="83" fill="#E0AA82"/><path d="M-5,-411 Q0,-405 5,-411" fill="none" stroke="#C98F66" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
<g data-part="cap" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex)"><path d="M-76,-446 C-80,-548 80,-548 76,-446 C58,-476 32,-486 0,-487 C-32,-486 -58,-476 -74,-452 Z" fill="#1B2F62"/></g></g></g>
<g data-part="hood" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex)"><path fill-rule="evenodd" d="M0,-554 C76,-554 118,-505 118,-432 C118,-378 102,-345 76,-328 L-76,-328 C-102,-345 -118,-378 -118,-432 C-118,-505 -76,-554 0,-554 Z M-71,-424 A71,79 0 1,0 71,-424 A71,79 0 1,0 -71,-424 Z" fill="#FFFCF4" stroke="#0D2047" stroke-width="3.2" stroke-linejoin="round"/><path d="M-96,-470 C-104,-430 -100,-384 -84,-352" fill="none" stroke="#E9E1CF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M96,-470 C104,-430 100,-384 84,-352" fill="none" stroke="#E9E1CF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
<g data-part="cheeks" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex-s)"><ellipse cx="-55" cy="-399" rx="13" ry="8" fill="#C97862"/><ellipse cx="55" cy="-399" rx="13" ry="8" fill="#C97862"/></g></g></g>
<g data-part="eyeL" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex-s)"><circle cx="-34" cy="-432" r="12.5" fill="#0D2047"/><circle cx="-30" cy="-436.5" r="4.2" fill="#FFFFFF"/><circle cx="-38.5" cy="-427" r="1.8" fill="#FFFFFF"/></g></g></g>
<g data-part="eyeR" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex-s)"><g transform="scale(-1 1)"><circle cx="-34" cy="-432" r="12.5" fill="#0D2047"/><circle cx="-30" cy="-436.5" r="4.2" fill="#FFFFFF"/><circle cx="-38.5" cy="-427" r="1.8" fill="#FFFFFF"/></g></g></g></g>
<g data-part="mouth" filter="url(#pp-lift)"><g transform="matrix(1 0 0 1 0 0)"><g filter="url(#pp-tex-s)"><path d="M-25,-397 C-12,-394 12,-394 25,-397 C23,-370 11,-361 0,-361 C-11,-361 -23,-370 -25,-397 Z" fill="#0D2047"/><path d="M-19,-395 L19,-395 L17,-388 Q0,-386 -17,-388 Z" fill="#FFFFFF"/><path d="M-12,-369 C-6,-378 6,-378 12,-369 C8,-363 -8,-363 -12,-369 Z" fill="#C97862"/></g></g></g>
<g data-part="browL" filter="url(#pp-lift)"><g transform="matrix(0.9945 -0.1045 0.1045 0.9945 48.2104 -13.8903)"><g filter="url(#pp-tex-s)"><path d="M-47,-463 C-41,-471 -28,-472 -21,-467 L-22,-459 C-29,-463 -41,-463 -46,-456 Z" fill="#2B211D"/></g></g></g>
<g data-part="browR" filter="url(#pp-lift)"><g transform="matrix(0.9945 0.1045 -0.1045 0.9945 -48.2104 -13.8903)"><g filter="url(#pp-tex-s)"><g transform="scale(-1 1)"><path d="M-47,-463 C-41,-471 -28,-472 -21,-467 L-22,-459 C-29,-463 -41,-463 -46,-456 Z" fill="#2B211D"/></g></g></g></g></g></g></svg>