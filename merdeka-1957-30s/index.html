<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Merdeka, 1946–1957 (Comic History Cartoon, 9:16, 30 s): one comic page, three story panels and a title panel.
// 1946: Britain slaps one big patch over the Malay states (the Malayan Union); Malaya shouts NO UNION!; the patch won't lie flat.
// 1956, London: an agreement on a desk, AGREED stamped, a handshake. 1957: Malaya peels the patch off; Britain lets go; MERDEKA!
// The page camera pulls back to the whole page as the title card lands.
const W = 1080, H = 1920, DUR = 30;
const QS = new URLSearchParams(location.search), FROM = +(QS.get('from') || 0), TO = +(QS.get('to') || DUR);
window.DUR = TO - FROM;
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');

// ---------------------------------------------------------------- palette
const C = {
  paper: '#F1E8D2', ink: '#2B2219',
  br: '#D08C82',        // Britain's printed colour (Singapore, still a British colony in 1957)
  brPatch: '#BE6F66',   // Britain's patch: one step deeper than its print, so it reads as new paper laid on top
  my: '#4F9A8A',        // Malaya's printed colour (teal, like his baju), revealed under the patch
  th: '#E2C27A', id: '#A9B98A', nb: '#C9B48E',
  sea: '#A6CCD3', red: '#C8463A', brass: '#D9B158', caption: '#F5E9C4', table: '#7B6A57',
};

// ---------------------------------------------------------------- small maths
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const EASE = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  o: u => 1 - Math.pow(1 - u, 3),
  i: u => u * u * u,
  back: u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  el: u => u >= 1 ? 1 : 1 - Math.exp(-5.5 * u) * Math.cos(u * Math.PI * 3.1),
};
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) {
      const [t0, v0] = keys[i - 1], u = EASE[e || 'io'](clamp((t - t0) / Math.max(t1 - t0, 1e-6), 0, 1));
      return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], u)) : lerp(v0, v1, u);
    }
  }
  return keys[keys.length - 1][1];
}
const wob = (t, t0, amp, f = 5, d = 7) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * d) * Math.sin(2 * Math.PI * f * (t - t0));
const popIn = (t, t0, d = 0.17) => t < t0 ? 0 : t - t0 < d ? EASE.el((t - t0) / d) : 1;
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }

const D2R = Math.PI / 180;
const twos = t => Math.floor(t * 12 + 1e-6) / 12;          // puppets move on twos
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const len = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const angOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);

// ---------------------------------------------------------------- the timeline (film seconds)
const T1 = {   // panel 1 · 1946, the Malayan Union
  hop: [0.6, 1.1, 1.6, 2.1], wind: 2.6, smear: 3.0, slap: 3.25,
  nounion: 7.45, puff: [8.0, 8.5], curl: 9.5,
};
const T2 = { stamp: 14.3, shake: 15.2 };   // panel 2 · 1956, London
const T = {    // panel 3 · 1957 (the peel)
  hop: [18.6, 19.1, 19.6], grip: 20.1,
  tug: [20.6, 21.3, 22.0],
  sigh: 22.3,                              // "And Britain"
  letgo: 23.15,                            // "lets go"
  peel: 23.45, strip: 23.6, merdeka: 23.7, pin: 23.95,
};
const TT = { title: 27.2 };                // panel 4 · the title card
const SUBS = [
  [0.05, 7.35, ['1946. Britain pastes one big patch over', 'the Malay states, and calls it the Malayan Union.']],
  [7.37, 11.38, ["The Malays won't have it.", "And the patch won't lie flat."]],
  [11.4, 15.9, ['Ten years later, in London,', 'both sides agree on a date.']],
  [17.4, 21.2, ['31st of August, 1957.']],
  [21.9, 24.7, ['And Britain lets go.']],
  [26.45, 29.95, ['No war. Just talks, and a lot of paper.']],
];
window.SUBS = SUBS;
const VO = [['v1', 0.1], ['v2', 7.4], ['v3', 11.6], ['v4', 17.5], ['v5', 22.3], ['v6', 26.5]];

// ---------------------------------------------------------------- projection (equirectangular, cos(lat0) aspect)
const LON0 = 102.0, LAT0 = 4.0, CX = 540, CY = 840, KS = 178;
const KX = KS * Math.cos(LAT0 * D2R);
const P = (lon, lat) => [CX + (lon - LON0) * KX, CY - (lat - LAT0) * KS];
function pathOf(polys, g) {
  g.beginPath();
  for (const poly of polys) for (const r of poly) { r.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); }
}
const GROUPS = [
  { fill: C.th, members: ['Thailand'] },
  { fill: C.id, members: ['Indonesia'] },
  { fill: C.nb, members: ['Myanmar', 'Cambodia', 'Vietnam'] },
  { fill: C.my, members: ['Malaya'] },
  { fill: C.br, members: ['Singapore'] },
];
let geo, idx, img = {}, paperTex, pagePat, tablePat, deskPat, MAP, PATCH, FOLDP, LAYER;
const MS = 1.25, PR = 2;

// ---------------------------------------------------------------- paper texture (generated)
function makePaper(w, h, seed) {
  const c = canvas(w, h), g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900 * w * h / (W * H); i++) {
    const x = r() * w, y = r() * h, rad = 20 + r() * 150, v = r() < .5 ? 0 : 255;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${v},${v},${v},${0.03 + r() * 0.03})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 6000 * w * h / (W * H); i++) {
    const x = r() * w, y = r() * h, a = r() * Math.PI * 2, l = 4 + r() * 20, v = r() < .55 ? 40 : 230;
    g.strokeStyle = `rgba(${v},${v},${v},${0.04 + r() * 0.07})`; g.lineWidth = 0.6 + r() * 0.9;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * .5, y + Math.sin(a + 1) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (r() - .5) * 22; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);

}
// numbers: Old Standard TT lining figures, at about 0.9 of the surrounding size, on the same baseline
const NUM_RE = /\d+(?:[.–]\d+)*/g;
function numFont(base) {
  const m = base.match(/(\d+(?:\.\d+)?)px\s+(\S+)/); if (!m) return base;
  const size = +m[1], fam = m[2], face = /It/.test(fam) ? 'OldStdIt' : /Lilita/.test(fam) ? 'OldStdB' : 'OldStd';
  return `${Math.round(size * (face === 'OldStdB' ? 0.92 : 0.9))}px ${face}`;
}
function textRuns(text) { const out = []; let i = 0; for (const m of text.matchAll(NUM_RE)) { if (m.index > i) out.push([text.slice(i, m.index), 0]); out.push([m[0], 1]); i = m.index + m[0].length; } if (i < text.length) out.push([text.slice(i), 0]); return out; }

function fillMixed(g, text, x, y, base, align = 'left') {
  const nf = numFont(base), w = measureMixed(g, text, base), a0 = g.textAlign;
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  g.textAlign = 'left';
  for (const [t, n] of textRuns(text)) { g.font = n ? nf : base; g.fillText(t, cx, y); cx += g.measureText(t).width; }
  g.font = base; g.textAlign = a0; return w;
}
function spacedLeft(g, text, x, y, sp) { const a = g.textAlign; g.textAlign = 'left'; let cx = x; for (const c of text) { g.fillText(c, cx, y); cx += g.measureText(c).width + sp; } g.textAlign = a; }
function spaced(g, text, x, y, sp) {
  const ch = [...text], w = ch.map(c => g.measureText(c).width), tot = w.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = x - tot / 2; ch.forEach((c, i) => { g.fillText(c, cx, y); cx += w[i] + sp; });
  return tot;
}

// ---------------------------------------------------------------- the printed map (baked once)
function drawMap(g) {
  g.fillStyle = C.sea; g.fillRect(-2000, -2000, W + 4000, H + 4000);
  const all = []; for (const G of GROUPS) for (const m of G.members) if (geo[m]) all.push(...geo[m]);
  g.save(); g.lineJoin = 'round';
  for (let i = 6; i >= 1; i--) { pathOf(all, g); g.lineWidth = i * 9; g.strokeStyle = i % 2 ? '#97BEC6' : '#AACED4'; g.stroke(); }
  g.restore();
  g.save(); g.strokeStyle = 'rgba(40,70,90,.20)'; g.lineWidth = 1; g.setLineDash([2, 5]);
  for (let lon = 96; lon <= 108; lon += 2) { const [x0, y0] = P(lon, 14), [x1, y1] = P(lon, -4); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  for (let lat = -2; lat <= 12; lat += 2) { const [x0, y0] = P(94, lat), [x1, y1] = P(110, lat); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  g.restore();
  for (const G of GROUPS) { pathOf(G.members.flatMap(m => geo[m] || []), g); g.fillStyle = G.fill; g.fill('evenodd'); }
  for (const G of GROUPS) {
    const polys = G.members.flatMap(m => geo[m] || []);
    g.save(); pathOf(polys, g); g.clip('evenodd'); pathOf(polys, g); g.lineWidth = 12; g.strokeStyle = 'rgba(255,248,230,.20)'; g.stroke(); g.restore();
  }
  g.save(); g.lineJoin = 'round';
  for (const G of GROUPS) for (const m of G.members) { if (!geo[m]) continue; pathOf(geo[m], g); g.lineWidth = 1.3; g.strokeStyle = 'rgba(55,40,30,.5)'; g.stroke(); }
  pathOf(all, g); g.lineWidth = 2.2; g.strokeStyle = 'rgba(40,55,70,.7)'; g.stroke();
  g.restore();
  // engraved place names: small caps, ink only, clear of the puppets, the bubble and the caption band
  g.fillStyle = 'rgba(43,34,25,.86)'; g.textBaseline = 'middle'; g.textAlign = 'left';
  const L = (t, lon, lat, size, sp, rot = 0) => { const [x, y] = P(lon, lat); g.save(); g.translate(x, y); g.rotate(rot * D2R); g.font = `${size}px FellSC`; spaced(g, t, 0, 0, sp); g.restore(); };
  L('malaya', 102.65, 2.8, 54, 14, -14);
  L('thailand', 101.55, 6.95, 34, 10, -8);
  L('sumatra', 99.95, -0.1, 32, 8, -40);
  L('singapore', 104.05, 0.98, 20, 2);
  g.font = 'italic 26px FellIt'; g.fillStyle = 'rgba(30,60,75,.55)';
  { const [x, y] = P(99.85, 3.35); g.save(); g.translate(x, y); g.rotate(-50 * D2R); spaced(g, 'Strait of Malacca', 0, 0, 3); g.restore(); }
  { const [x, y] = P(104.2, 7.7); g.save(); g.translate(x, y); g.rotate(-6 * D2R); spaced(g, 'South China Sea', 0, 0, 3); g.restore(); }
  // compass rose and a kilometre scale bar, bottom right above the caption band
  { const cx = 990, cy = 1460; g.save(); g.translate(cx, cy); g.strokeStyle = C.ink; g.fillStyle = C.ink; g.lineWidth = 1.5;
    g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(0, 0, 25, 0, Math.PI * 2); g.lineWidth = .8; g.stroke(); g.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.beginPath(); g.moveTo(0, -42); g.lineTo(6, 0); g.lineTo(-6, 0); g.closePath(); i === 3 ? g.fill() : g.stroke(); }
    g.font = '20px FellSC'; g.textAlign = 'center'; g.fillText('n', 0, -55); g.restore(); }
  { const km = KS / 111.2, x0 = 700, y0 = 1580, L100 = 100 * km; g.save(); g.fillStyle = C.ink; g.strokeStyle = C.ink; g.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) { const xa = x0 + i * L100 / 2; i % 2 ? g.strokeRect(xa, y0, L100 / 2, 7) : g.fillRect(xa, y0, L100 / 2, 7); }
    g.font = '17px OldStd'; g.textAlign = 'center'; g.textBaseline = 'bottom';
    [0, 100, 200].forEach((k, i) => g.fillText(String(k), x0 + i * L100, y0 - 5)); g.font = '18px Fell'; g.textAlign = 'left'; g.fillText('km', x0 + 2 * L100 + 26, y0 - 5); g.restore(); }
}
function bakeMap() {
  const c = canvas(W * MS, H * MS), g = c.getContext('2d');
  g.scale(MS, MS); drawMap(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.55; g.drawImage(paperTex, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  return c;
}

// ---------------------------------------------------------------- Britain's patch (baked at PR, cream card margin, dashed inner line)
let PB, PATCH_C;
function malPath(g) { pathOf(geo['Malaya'], g); }
function silhouette(src, col) { const c = canvas(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; }
function bakePatch(col, seed) {
  const w = (PB.x1 - PB.x0) * PR, h = (PB.y1 - PB.y0) * PR, toW = g => g.setTransform(PR, 0, 0, PR, -PB.x0 * PR, -PB.y0 * PR);
  const shape = canvas(w, h), k = shape.getContext('2d');
  toW(k); k.save(); malPath(k); k.clip('evenodd'); k.fillStyle = col; k.fillRect(PB.x0, PB.y0, PB.x1 - PB.x0, PB.y1 - PB.y0);
  malPath(k); k.lineWidth = 14; k.strokeStyle = 'rgba(255,248,230,.18)'; k.stroke();
  k.setLineDash([7, 6]); malPath(k); k.lineWidth = 3.5; k.strokeStyle = 'rgba(60,30,26,.5)'; k.stroke(); k.restore();
  k.setTransform(1, 0, 0, 1, 0, 0);
  const tex = makePaper(Math.ceil(w), Math.ceil(h), seed);
  const t2 = canvas(w, h), q2 = t2.getContext('2d'); q2.drawImage(shape, 0, 0); q2.globalCompositeOperation = 'overlay'; q2.globalAlpha = .6; q2.drawImage(tex, 0, 0);
  q2.globalCompositeOperation = 'destination-in'; q2.globalAlpha = 1; q2.drawImage(shape, 0, 0);
  const card = canvas(w, h), q = card.getContext('2d'), r = rng(seed + 3);
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, rr = 7 * PR * (0.92 + r() * 0.16); q.drawImage(shape, Math.cos(a) * rr, Math.sin(a) * rr); }
  q.globalCompositeOperation = 'source-in'; q.fillStyle = C.paper; q.fillRect(0, 0, w, h);
  q.globalCompositeOperation = 'source-over';
  q.save(); q.shadowColor = 'rgba(40,28,15,.35)'; q.shadowBlur = 2.5; q.drawImage(t2, 0, 0); q.restore();
  return { cv: card };
}
function cutPiece(Pc, poly) {   // a piece of the patch inside a polygon given in patch-local coords (relative to PATCH_C)
  const c = canvas(Pc.cv.width, Pc.cv.height), g = c.getContext('2d');
  g.setTransform(PR, 0, 0, PR, -(PB.x0 - PATCH_C[0]) * PR, -(PB.y0 - PATCH_C[1]) * PR);
  g.beginPath(); poly.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.clip();

// draw a patch with its centre at c, rotation rot (deg), lift h (0 glued: thin shadow; 1 held up: big soft shadow)
function drawPatch(g, Pc, o = {}) {
  const c = o.c || PATCH_C, h = o.h || 0, k = (o.k || 1) * (1 + 0.08 * h), z = o.z || 1;
  g.save();
  g.shadowColor = `rgba(30,20,10,${(o.shadowA ?? 0.5) - 0.18 * h})`; g.shadowBlur = (3 + 30 * h) * z; g.shadowOffsetX = (3 + 30 * h) * z; g.shadowOffsetY = (4 + 42 * h) * z;
  g.translate(c[0], c[1]); g.rotate((o.rot || 0) * D2R); g.scale(k, k);

}
// the curling corner: the part beyond the line A→B (patch-local) is turned up by th degrees (0 flat, 180 folded back)
let FOLD;
function foldPieces(Pc) {

  const far = 1400, ext = 4;
  const side = s => [[A[0] - d[0] * ext, A[1] - d[1] * ext], [B[0] + d[0] * ext, B[1] + d[1] * ext], [B[0] + d[0] * ext + s * n[0] * far, B[1] + d[1] * ext + s * n[1] * far], [A[0] - d[0] * ext + s * n[0] * far, A[1] - d[1] * ext + s * n[1] * far]];

function drawFolded(g, th, o = {}) {

  g.restore();
}
function foldTip(th) {   // where the corner's tip is (world), for Malaya's hand
  const m = foldMat(th), [x, y] = FOLD.tip;
  return [PATCH_C[0] + m[0] * x + m[2] * y + m[4], PATCH_C[1] + m[1] * x + m[3] * y + m[5]];
}
function foldAngle(t) {
  if (t < T.grip) return 96 + 22 * Math.sin(2 * Math.PI * 1.25 * twos(t));   // flapping on its own: it won't lie flat
  const k = T.tug.filter(x => t >= x).length;
  if (k === 0) return K(t, [[T.grip, 100], [T.grip + .2, 108, 'o']]);
  let th = [108, 126, 144, 160][k] - 18 * Math.exp(-(t - T.tug[k - 1]) * 9) * Math.cos(2 * Math.PI * 3 * (t - T.tug[k - 1]));   // a yank, then the paper springs back a little
  if (t > T.tug[2] + .3) th += 3 * Math.sin(2 * Math.PI * 3 * (twos(t) - T.tug[2]));   // straining at full stretch
  return th;

// ---------------------------------------------------------------- puppets (pivots read off parts/*_debug.jpg, sheet px)
const RIG = {
  br: {
    s: 0.6, neck: [525, 382], sh: { L: [423, 446], R: [624, 446] }, hip: { L: [462, 712], R: [592, 712] },
    uarm: { L: { id: 5, p: [264, 424], e: [196, 580] }, R: { id: 6, p: [802, 423], e: [866, 582] } },

  [16.8, 540, 2300, 1], [17.1, 540, 3050, .66, 'i'], [17.4, 540, 3900, 1, 'o'],   // a drop down the page into 1957

window.TEXTS = t => { renderFilm(t + FROM); return TXT.filter(x => x.x1 > 0 && x.x0 < W && x.y1 > 0 && x.y0 < H).map(({ id, text, x0, y0, x1, y1 }) => ({ id, text, x0, y0, x1, y1 })); };

  // 1957

  T.hop.forEach((t, i) => E(t, 'hop', { i, pan: -.8 + .25 * i }));
  E(T.hop[2] + .5, 'land', { pan: -.5 }); E(T.grip, 'grab', { pan: -.3 });
  T.tug.forEach((t, i) => { E(t, 'tug', { i, pan: -.2 }); E(t + .05, 'strain', { d: .45, pan: .5 }); });
  E(T.tug[2] + .3, 'hold', { d: T.letgo - T.tug[2] - .3, pan: 0 });
